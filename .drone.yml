kind: pipeline
type: kubernetes

steps:
  - name: cordova-build
    image: thegeeklab/drone-docker-buildx
    privileged: true
    settings:
      username: sgj0
      password:
        from_secret: DOCKER_PASSWORD
      repo: sgj0/${DRONE_REPO_NAME}
      dockerfile: ./cordova-build/Dockerfile
      tags: cordova-build
      context: ./cordova-build
      platform: linux/amd64, linux/arm64

  - name: frankenphp
